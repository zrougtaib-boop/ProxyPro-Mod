name: Build APK

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Apktool
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool

    - name: Clean conflicting backup files
      run: |
        find . -name "*.bak" -delete

    - name: Build APK with Apktool (No resource restrictions)
      run: |
        apktool b . -o dist/ProxyPro_release.apk --use-aapt2 || apktool b . -o dist/ProxyPro_release.apk

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: ProxyPro-Signed
        path: dist/ProxyPro_release.apk
